# ===============================
# Server Configuration
# ===============================
server:
  port: ${PORT:8080}  # Render injects the port automatically

# ===============================
# Database Configuration
# ===============================
spring:
  datasource:
    url: ${DATABASE_URL}           # e.g., jdbc:postgresql://host:port/db
    username: ${DB_USERNAME}       # Postgres username
    password: ${DB_PASSWORD}       # Postgres password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update             # Use 'validate' in strict production
    show-sql: true                 # Optional: logs SQL queries
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT Configuration
# ===============================
app:
  jwt:
    secret: visitafrica-super-secret-jwt-key-2025-change-in-production!!
    expiration-ms: 86400000        # 24 hours

# ===============================
# Logging Configuration
# ===============================
logging:
  level:
    web: ERROR
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure: ERROR
    org.springframework.security: DEBUG
    ug.visituganda.visituganda.security: DEBUG

