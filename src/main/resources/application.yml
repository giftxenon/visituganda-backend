# ===============================
# Application
# ===============================
spring:
  application:
    name: visituganda

  # ===============================
  # Database Configuration
  # ===============================
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db.rcnywheoazmghydwatnt.supabase.co:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ===============================
# Server Configuration
# ===============================
server:
  port: ${PORT:8080}

# ===============================
# JWT Configuration
# ===============================
app:
  jwt:
    secret: ${JWT_SECRET:visituganda-secret-jwt-key-2025-production-secure-key}
    expiration-ms: ${JWT_EXPIRATION:86400000}

# ===============================
# Logging Configuration
# ===============================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    ug.visituganda.visituganda.security: DEBUG