# ===============================
# Server Configuration
# ===============================
server:
  port: ${PORT:8080}  # Render injects the port automatically

# ===============================
# Spring Configuration
# ===============================
spring:
  datasource:
    url: ${DATABASE_URL}           # e.g., jdbc:postgresql://host:port/db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update             # Use 'validate' in strict production
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===============================
  # Multipart / File Upload Configuration
  # ===============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# ===============================
# JWT Configuration
# ===============================
app:
  jwt:
    secret: "visitafrica-super-secret-jwt-key-2025-change-in-production!!-extra-long-to-64-chars!!"
    expiration-ms: 86400000

# ===============================
# Logging Configuration
# ===============================
logging:
  level:
    web: ERROR
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure: ERROR
    org.springframework.security: DEBUG
    ug.visituganda.visituganda.security: DEBUG